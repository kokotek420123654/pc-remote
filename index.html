<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131b"><title>PC Remote</title><style>*{box-sizing:border-box}body{margin:0;background:#10131b;color:#f5f7ff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;padding:env(safe-area-inset-top) 16px 35px}header{display:flex;justify-content:space-between;align-items:center;padding:25px 4px 15px}h1{font-size:24px;margin:0}.status{font-size:12px;color:#b5bac8;background:#262b38;padding:8px 12px;border-radius:30px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:20px}.tabs button{white-space:nowrap;background:#222734;padding:11px 15px;border:0;border-radius:15px;color:#ddd}.tabs button.active{background:#4779e7;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.tile{min-height:104px;background:linear-gradient(145deg,#2a3141,#202634);border:1px solid #3b4355;border-radius:21px;color:white;font-size:13px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}.tile .emoji{font-size:29px}.panel{background:#202633;border:1px solid #323b4c;border-radius:20px;padding:18px;margin-top:15px}.panel h2{font-size:14px;color:#b9c5d9;margin:0 0 16px}input[type=range]{width:100%;accent-color:#77a2ff}input[type=text]{width:100%;border:1px solid #48556d;border-radius:12px;background:#141a26;color:white;padding:13px;font-size:16px}.wide{width:100%;border:0;background:#4779e7;color:white;border-radius:13px;padding:13px;margin-top:10px;font-size:15px}.hint{font-size:12px;color:#9da9be;line-height:1.5}.touch{height:230px;border:1px dashed #64728b;border-radius:18px;display:grid;place-items:center;color:#9da9be;touch-action:none}.hide{display:none}label{display:block;margin-top:10px;font-size:13px;color:#c2cde0}</style></head><body><header><h1>PC REMOTE</h1><span class="status">● PC nepřipojeno</span></header><div class="tabs" id="tabs"></div><main id="main"></main><script>
const sections=['🏠 Hlavní','🎵 YouTube','🖱️ Myš','⚙️ Úpravy'];let current=0;const defaults=[{name:'YouTube',emoji:'▶️',cmd:'youtube'},{name:'Pauza',emoji:'⏯️',cmd:'playpause'},{name:'Další',emoji:'⏭️',cmd:'next'},{name:'Hlasitost +',emoji:'🔊',cmd:'volup'},{name:'Hlasitost −',emoji:'🔉',cmd:'voldown'},{name:'Průzkumník',emoji:'📁',cmd:'explorer'}];let buttons;try{buttons=JSON.parse(localStorage.getItem('remoteButtons'))||defaults}catch(e){buttons=defaults}let vol=50;function save(){localStorage.setItem('remoteButtons',JSON.stringify(buttons))}function command(cmd){if(cmd==='youtube'){show(1);return}alert('Příkaz „'+cmd+'“ bude fungovat po propojení s PC.')}function tile(b){return `<button class="tile" data-cmd="${b.cmd.replaceAll('"','&quot;')}"><span class="emoji">${b.emoji}</span><span>${b.name}</span></button>`}function show(n){current=n;render()}function render(){document.getElementById('tabs').innerHTML=sections.map((s,i)=>`<button class="${i===current?'active':''}" data-tab="${i}">${s}</button>`).join('');let h='';if(current===0)h=`<div class="grid">${buttons.map(tile).join('')}</div><div class="panel"><h2>🔊 Hlasitost · <span id="v">${vol}%</span></h2><input type="range" id="volume" min="0" max="100" value="${vol}"></div>`;if(current===1)h=`<div class="panel"><h2>🔎 Vyhledávání YouTube</h2><input id="search" type="text" placeholder="Název skladby nebo videa"><button class="wide" id="find">Vyhledat na PC</button></div><div class="grid" style="margin-top:14px">${[{name:'−10 s',emoji:'⏪',cmd:'back10'},{name:'Pauza',emoji:'⏯️',cmd:'playpause'},{name:'+10 s',emoji:'⏩',cmd:'forward10'},{name:'Předchozí',emoji:'⏮️',cmd:'previous'},{name:'Další',emoji:'⏭️',cmd:'next'},{name:'Celá obrazovka',emoji:'⛶',cmd:'fullscreen'}].map(tile).join('')}</div>`;if(current===2)h=`<div class="panel"><h2>🖱️ Touchpad</h2><div class="touch">Touchpad připravený k propojení</div><div class="grid" style="grid-template-columns:1fr 1fr;margin-top:12px">${[{name:'Levý klik',emoji:'👆',cmd:'leftclick'},{name:'Pravý klik',emoji:'☝️',cmd:'rightclick'}].map(tile).join('')}</div></div><div class="panel"><h2>⌨️ Klávesnice</h2><input placeholder="Text pro PC (po připojení)" disabled></div>`;if(current===3)h=`<div class="panel"><h2>Upravit hlavní tlačítka</h2><div id="editor">${buttons.map((b,i)=>`<div class="panel"><label>Tlačítko ${i+1}</label><input data-edit="${i}" data-field="name" value="${b.name.replaceAll('"','&quot;')}"><label>Ikona (emoji)</label><input data-edit="${i}" data-field="emoji" value="${b.emoji}"><label>Příkaz</label><input data-edit="${i}" data-field="cmd" value="${b.cmd}"><button class="wide" style="background:#79404a" data-delete="${i}">Smazat</button></div>`).join('')}</div><button class="wide" id="add">+ Přidat tlačítko</button><button class="wide" id="reset" style="background:#353f52">Obnovit výchozí</button><p class="hint">Úpravy se ukládají v tomto prohlížeči. Nemaž data webu, jinak se mohou ztratit.</p></div>`;document.getElementById('main').innerHTML=h;document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>show(+x.dataset.tab));document.querySelectorAll('[data-cmd]').forEach(x=>x.onclick=()=>command(x.dataset.cmd));let slider=document.getElementById('volume');if(slider)slider.oninput=()=>{vol=+slider.value;document.getElementById('v').textContent=vol+'%'};let find=document.getElementById('find');if(find)find.onclick=()=>{let q=document.getElementById('search').value.trim();if(!q)return;alert('Vyhledávání „'+q+'“ na PC bude fungovat po propojení.');};document.querySelectorAll('[data-edit]').forEach(x=>x.onchange=()=>{buttons[+x.dataset.edit][x.dataset.field]=x.value;save()});document.querySelectorAll('[data-delete]').forEach(x=>x.onclick=()=>{buttons.splice(+x.dataset.delete,1);save();render()});let add=document.getElementById('add');if(add)add.onclick=()=>{buttons.push({name:'Nové tlačítko',emoji:'✨',cmd:'custom'});save();render()};let reset=document.getElementById('reset');if(reset)reset.onclick=()=>{buttons=structuredClone(defaults);save();render()}}render();
</script></body></html>
